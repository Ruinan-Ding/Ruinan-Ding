<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sky" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#c8d4f2"/>
    </radialGradient>
    <linearGradient id="letters" x1="28" y1="35" x2="72" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D61F7E"/>
      <stop offset="50%" stop-color="#6A0DAD"/>
      <stop offset="100%" stop-color="#0B5FBF"/>
    </linearGradient>
    <style>
      @keyframes drawR {
        0% { stroke-dashoffset: 180; }
        40% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes drawD {
        0% { stroke-dashoffset: 160; }
        40% { stroke-dashoffset: 160; }
        80% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .letter-r {
        stroke-dasharray: 180;
        animation: drawR 3s ease-in-out infinite;
      }
      .letter-d {
        stroke-dasharray: 160;
        animation: drawD 3s ease-in-out infinite;
      }
      .star { animation: twinkle 2.2s ease-in-out infinite; }
      .star-b { animation-delay: 0.7s; }
      .star-c { animation-delay: 1.4s; }
    </style>
  </defs>

  <rect width="100" height="100" fill="url(#sky)"/>

  <circle class="star" cx="12" cy="16" r="3" fill="#FF80BF"/>
  <circle class="star star-b" cx="86" cy="12" r="2.4" fill="#8A2BE2"/>
  <circle class="star star-c" cx="90" cy="82" r="3" fill="#00D4FF"/>
  <circle class="star star-b" cx="10" cy="86" r="2.4" fill="#FFD166"/>
  <circle class="star star-c" cx="78" cy="42" r="2" fill="#7CFFB2"/>

  <g transform="translate(50 50) scale(1.9) translate(-50 -47.5)"
     fill="none" stroke="url(#letters)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <path class="letter-r" d="M 28 35 L 28 60 M 28 35 L 38 35 Q 42 35 42 40 Q 42 45 38 45 L 28 45 M 42 45 L 48 60"/>
    <path class="letter-d" d="M 56 35 L 56 60 M 56 35 L 64 35 Q 72 36 72 47.5 Q 72 59 64 60 L 56 60"/>
  </g>
</svg>
